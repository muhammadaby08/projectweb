<audio id="bgMusic" loop>
  <source src="TULUS - Teh Hijau.mp3" type="audio/mpeg">
  Browser Anda tidak mendukung elemen audio.
</audio>

<!-- Tombol Floating Play/Pause Musik -->
<button id="musicToggleBtn" class="music-btn" onclick="toggleMusic()">
  🎵 <span id="musicText">Play Music</span>
 <script> const bgMusic = document.getElementById("bgMusic");
const musicText = document.getElementById("musicText");
let isMusicPlaying = false;

// Atur volume musik (0.0 sampai 1.0)
bgMusic.volume = 0.3; 

function toggleMusic() {
  if (isMusicPlaying) {
    // Jika sedang play, maka pause
    bgMusic.pause();
    musicText.innerText = "Play Music";
    isMusicPlaying = false;
  } else {
    // Jika sedang pause, maka play
    bgMusic.play().then(() => {
      musicText.innerText = "Pause Music";
      isMusicPlaying = true;
    }).catch((error) => {
      console.log("Pemutaran audio diblokir oleh browser:", error);
    });
  }
} </script>
</button>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Stok Bahan Ajar</title>
  <link rel="stylesheet" href="stock.css">

</head>
<body>

  <div class="container">
    <h2>Daftar Stok Bahan Ajar</h2>

   
    <form id="formStok" class="form-group">
      <input type="text" id="inputKode" placeholder="Kode Paket (contoh: BMP004)" required>
      <input type="text" id="inputNama" placeholder="Nama Bahan Ajar" required>
      <input type="number" id="inputStok" placeholder="Jumlah Stok" required>
      <input type="text" id="inputHarga" placeholder="Harga (contoh: Rp 50.000)" required>
      <button type="submit" class="btn-add">+ Tambah Stok</button>
    </form>

  
    <table>
      <thead>
        <tr>
          <th>Kode</th>
          <th>Nama Bahan Ajar</th>
          <th>Stok</th>
          <th>Harga</th>
        </tr>
      </thead>
      <tbody id="tabelStokBody">
      </tbody>
    </table>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
